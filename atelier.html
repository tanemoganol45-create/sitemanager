<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier 2D SITE MANAGER</title>
<style>
:root{--bg:#f0f9ff;--card:#fff;--bd:#dbe4ee;--tx:#0f172a;--mut:#64748b;--pri:#0284c7;--pri2:#e0f2fe;--ok:#16a34a;--bad:#dc2626;--warn:#d97706;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;flex-direction:column;height:100dvh;max-width:100vw;padding-top:env(safe-area-inset-top,0)}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;background:#fff;border-bottom:1px solid var(--bd);flex:none}
header .ib{width:42px;height:42px;flex:none;border:1px solid var(--bd);background:#fff;border-radius:10px;display:grid;place-items:center}
header .ib svg{width:22px;height:22px}
#pname{flex:1;min-width:0;height:42px;border:1px solid transparent;border-radius:10px;padding:0 8px;font-weight:700;background:transparent;text-overflow:ellipsis}
#pname:focus{border-color:var(--pri);background:#fff;outline:none}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:#fff;padding:0 10px;height:40px;font-weight:600;font-size:14px}
.seg button[aria-pressed=true]{background:var(--pri);color:#fff}
#stage{position:relative;flex:1;min-height:0;background:#fff;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.fab{position:absolute;display:flex;flex-direction:column;gap:6px}
.fab button{width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 1px 4px rgba(15,23,42,.12);font-size:20px;font-weight:700}
.fab button:disabled{opacity:.35}
.fab svg{width:22px;height:22px}
#fabR{left:8px;bottom:40px}
#fabL{left:8px;top:8px}
#info{position:absolute;left:8px;bottom:6px;font-size:12px;color:var(--mut);background:rgba(255,255,255,.9);padding:2px 8px;border-radius:8px;pointer-events:none;max-width:70%}
#qbar{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;background:rgba(255,255,255,.97);border:1px solid var(--bd);border-radius:16px;box-shadow:0 2px 10px rgba(15,23,42,.22);max-width:calc(100% - 130px);overflow-x:auto;z-index:4;scrollbar-width:none}
#qbar:empty{display:none}
#qbar button{flex:0 0 auto;min-width:54px;height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:#334155}
#qbar button svg{width:22px;height:22px}
#qbar button.hot{background:#fff7ed;color:#c2410c}
#qbar button.del{color:var(--bad)}
#qbar button.set{background:var(--pri2);color:#075985}
#home{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
#home[hidden]{display:none}
.hh{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#fff;border-bottom:1px solid var(--bd);flex:none}
.hh h1{flex:1;min-width:0;font-size:19px;margin:0;word-break:break-word}
.hb{flex:1;overflow:auto;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0))}
.hbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.hbar .btn{flex:1 1 auto}
.hc{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.hc .tt{flex:1;min-width:0}.hc b{display:block;font-size:16px;word-break:break-word}.hc small{color:var(--mut)}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.hd{background:#fff;border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.hd img{width:100%;aspect-ratio:300/212;display:block;background:#fff;border-bottom:1px solid var(--bd)}
.hd .tt{padding:8px}
#toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:8px 14px;border-radius:10px;font-size:13px;max-width:88%;text-align:center;z-index:50}
#ctx{flex:none;background:#fff;border-top:1px solid var(--bd);padding:6px 8px;max-height:38vh;overflow:auto}
.row .chip{min-height:34px;padding:0 10px}
#ctx:empty{display:none}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:3px 0}
.row>label{font-size:12px;color:var(--mut);font-weight:600;min-width:64px}
.row.sc{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.row.sc::-webkit-scrollbar{display:none}.row.sc>*{flex:0 0 auto}
.chip{border:1px solid var(--bd);background:#fff;border-radius:999px;padding:0 12px;min-height:38px;font-size:13px;font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--pri2);border-color:var(--pri);color:#075985}
.btn{border:1px solid var(--bd);background:#fff;border-radius:10px;padding:0 14px;min-height:42px;font-weight:700}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.bad{color:var(--bad);border-color:#fecaca;background:#fff5f5}
.btn.sm{min-height:36px;padding:0 10px;font-size:13px}
.inp{height:40px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;min-width:0;background:#fff}
.inp.n{width:84px;text-align:right}
textarea.inp{height:64px;padding:8px;width:100%;resize:none}
#mid{flex:1;min-height:0;display:flex}
#tools{flex:none;width:64px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;padding:5px 4px calc(5px + env(safe-area-inset-bottom,0));background:#fff;border-left:1px solid var(--bd);scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
#tools button{flex:0 0 auto;width:100%;height:52px;border:1px solid transparent;border-radius:12px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:10px;font-weight:600;color:#334155;padding:0}
#tools button svg{width:23px;height:23px}
#tools button[aria-pressed=true]{background:#f97316;border-color:#f97316;color:#fff}
#tools .sep{flex:0 0 1px;height:1px;background:var(--bd);margin:4px 2px}
.csw{width:34px;height:34px;min-height:0;padding:0;border-radius:50%}.csw[aria-pressed=true]{outline:3px solid #0284c7;outline-offset:2px}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#ov{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;z-index:20}
#ov.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;max-height:88dvh;background:#fff;border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-width:760px;margin:0 auto}
#sheet .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--bd)}
#sheet .hd b{flex:1;font-size:17px}
#sheet .bd{overflow:auto;padding:12px 14px calc(18px + env(safe-area-inset-bottom,0))}
.card{border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin:0 0 10px;background:#fff}
.card h4{margin:0 0 6px;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:5px 4px;border-bottom:1px solid #eef2f7;text-align:left;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
.tot{background:var(--pri);color:#fff;border-radius:var(--r);padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:20px;margin:0 0 10px}
.note{font-size:12px;color:var(--mut)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.proj{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid #eef2f7}
.proj span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #eef2f7}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="ib" id="b-back" aria-label="Retour aux projets" style="font-size:22px;font-weight:700;line-height:1">←</button>
    <button class="ib" id="b-menu" aria-label="Projets et réglages"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <input id="pname" aria-label="Nom du projet" autocomplete="off">
    <div class="seg"><button id="m-plan" aria-pressed="true">Plan</button><button id="m-meet" aria-pressed="false">Réunion</button></div>
    <button class="ib" id="b-metres" aria-label="Métrés et coût"><svg class="i" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 11h2M12 11h2M8 15h2M12 15h2M16 11v4"/></svg></button>
  </header>
  <div id="home" hidden></div>
  <div id="offb" hidden style="background:#fff7ed;color:#9a3412;border-bottom:1px solid #fdba74;padding:6px 10px;font-size:12px;font-weight:600">⚠ Fichier ouvert hors connexion : tes plans peuvent être perdus. Ouvre l’Atelier par son lien Internet.</div>
  <div id="mid"><div id="stage">
    <canvas id="cv"></canvas>
    <div class="fab" id="fabL"><button id="b-pdf" aria-label="Aperçu PDF"><b style="font-size:13px;color:#F07A1A;letter-spacing:.3px">PDF</b></button><button id="b-undo" aria-label="Annuler"><svg class="i" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button><button id="b-redo" aria-label="Rétablir"><svg class="i" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button></div>
    <div class="fab" id="fabR"><button id="b-txt" aria-label="Taille du texte"><b style="font-size:15px">Aa</b></button><button id="b-zin" aria-label="Zoom avant">+</button><button id="b-zout" aria-label="Zoom arrière">−</button><button id="b-dim" aria-label="Cotes"><svg class="i" viewBox="0 0 24 24"><path d="M3 8v8M21 8v8M3 12h18M7 9l-4 3 4 3M17 9l4 3-4 3"/></svg></button><button id="b-fit" aria-label="Ajuster"><svg class="i" viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button></div>
    <div id="qbar"></div>
    <div id="info"></div>
    <div id="toast" hidden></div>
  </div>
  <nav id="tools" aria-label="Outils"></nav></div>
  <section id="ctx"></section>
</div>
<div id="ov"><div id="sheet" role="dialog" aria-modal="true"><div class="hd"><b id="sh-t"></b><button class="btn sm" id="sh-x">Fermer</button></div><div class="bd" id="sh-b"></div></div></div>
<input type="file" id="f-img" accept="image/*" hidden>
<input type="file" id="f-json" accept=".json,application/json" hidden>

function restoreData(j){const o=JSON.parse(j);
 if(S.mode==='plan'){D.walls=o.w;D.ops=o.o;D.posts=o.p;D.foots=o.f;D.beams=o.b;D.lines=o.l||[];D.cotes=o.c||[];D.rooms=o.r;D.nid=o.n;D.set=o.s;computeRooms();}
 else{D.meet.pins=o.p;D.meet.nid=o.n;}
 S.sel=null;S.chain=null;S.draft=null;}
function push(){hist.push(snapData());if(hist.length>100)hist.shift();redo=[];touch();}

/* ---------- géométrie ---------- */
const wlen=w=>Math.hypot(w.x2-w.x1,w.y2-w.y1);
function distSeg(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;let t=l2?((px-x1)*dx+(py-y1)*dy)/l2:0;t=clamp(t,0,1);return{d:Math.hypot(px-(x1+t*dx),py-(y1+t*dy)),t};}
function opGeom(o){const w=D.walls.find(x=>x.id===o.wid);if(!w)return null;const L=wlen(w)||1,ux=(w.x2-w.x1)/L,uy=(w.y2-w.y1)/L;
 return{w,L,ux,uy,nx:-uy,ny:ux,cx:w.x1+ux*L*o.t,cy:w.y1+uy*L*o.t};}
function toW(p){const v=view();return[(p.x-v.ox)/v.s,(p.y-v.oy)/v.s];}
function bounds(wallsOnly){const xs=[],ys=[];
 D.walls.forEach(w=>{xs.push(w.x1,w.x2);ys.push(w.y1,w.y2);});
 if(!wallsOnly){D.beams.concat(D.lines).forEach(w=>{xs.push(w.x1,w.x2);ys.push(w.y1,w.y2);});D.cotes.forEach(c=>{const G=coteGeom(c);xs.push(c.x1,c.x2,G.a2[0],G.b2[0]);ys.push(c.y1,c.y2,G.a2[1],G.b2[1]);});D.posts.concat(D.foots).forEach(p=>{xs.push(p.x);ys.push(p.y);});}
 if(!xs.length)return{x0:0,y0:0,x1:10,y1:7};
 return{x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};}
function fitView(v,W,H,pad,b){b=b||(S.mode==='plan'?bounds():{x0:0,y0:0,x1:20,y1:20*(MI?MI.height/MI.width:.7)});
 const bw=Math.max(b.x1-b.x0,1.5),bh=Math.max(b.y1-b.y0,1.5);v.s=clamp(Math.min((W-2*pad)/bw,(H-2*pad)/bh),8,400);
 v.ox=(W-bw*v.s)/2-b.x0*v.s;v.oy=(H-bh*v.s)/2-b.y0*v.s;}

 if(k==='wall'){h+=b('rot90','rot','90°')+b('keep','cote','Coter')+b('lock',sel.lk?'lock':'unlock',sel.lk?'Déverr.':'Verrou',sel.lk?'hot':'')+b('lnk','link',D.set.link===false?'Coins libres':'Coins liés');
  const bad=[1,2].find(e=>{const P=e===1?[sel.x1,sel.y1]:[sel.x2,sel.y2],Q=e===1?[sel.x2,sel.y2]:[sel.x1,sel.y1],ref=refAngle(P,sel.id);return ref!=null&&Math.abs(angDiff(Math.atan2(Q[1]-P[1],Q[0]-P[0]),ref)*180/Math.PI-90)>=.3;});

 else if(k==='line'&&sel.sh)h+=b('shfill','eq','Remplir')+b('shpot','post','Poteau',sel.pot?'hot':'');
 else if(k==='line')h+=b('rot90','rot','90°')+b('toWall','link','En mur')+b('lsq','eq','Aligner')+b('lcl','link',sel.cl?'Ferme ✓':'Ferme',sel.cl?'hot':'');
 else if(k==='beam')h+=b('rot','rot','Pivoter');
 else if(k==='op'){if(sel.k==='door')h+=b('hinge','mir','Miroir')+b('side','flip','Sens');}
 else if(k==='post'){h+=b('rot','rot','Pivoter')+b('pal','eq','Aligner');}
 else if(k==='foot'){}

$('#qbar').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(!b)return;const a=b.dataset.q,s=getSel();if(a.startsWith('m-')){msAct(a);return;}if(!s)return;
 if(a==='set'){if(S.tool!=='select'){const k=S.sel;S.tool='select';S.chain=null;S.draft=null;S.sel=k;renderTools();}S.panel=true;renderCtx();draw();}else if(a==='del')delSel();else if(a==='dup')dupSel();else if(a==='rot')rotSel();
 else if(a==='lreset'){push();s.lo=null;refresh();toast('Glisse le nom de la pièce (pièce sélectionnée) pour le déplacer.');}
 else if(a==='shfill'){push();const C=[null,'#111827','#94a3b8','#F07A1A','#2563eb'],i=C.indexOf(s.fill||null);s.fill=C[(i+1)%C.length];if(!s.fill)s.pot=false;refresh();}

 else if(a==='rot90'){push();rotObj(s,90);computeRooms();refresh();}
 else if(a==='lsq'){push();if(!straighten(s,8))toast('Déjà droit ou trop incliné.');computeRooms();refresh();}
 else if(a==='lcl'){push();s.cl=!s.cl;computeRooms();refresh();toast(s.cl?'Ce trait ferme les pièces (véranda).':'Ce trait ne ferme plus de pièce.');}
 else if(a==='toWall'){const l=getSel();if(l&&toWalls([l])){S.sel={k:'wall',id:l.id};computeRooms();refresh();toast('Trait converti en mur.');}}
 else if(a==='rotl'||a==='rotr'){push();rotObj(s,(a==='rotl'?-1:1)*(D.set.rstep||15));computeRooms();refresh();}
 else if(a==='lock'){push();s.lk=!s.lk;toast(s.lk?'Mur verrouillé : il ne bouge plus.':'Mur déverrouillé.');refresh();}
 else if(a==='lnk'){D.set.link=D.set.link===false;touch();renderCtx();draw();toast(D.set.link===false?'Coins libres : un mur se décolle seul.':'Coins liés : les murs voisins suivent.');}
 else if(a==='hinge'){push();s.hinge=s.hinge?0:1;refresh();}else if(a==='side'){push();s.side=s.side?0:1;refresh();}
 else if(a==='keep')keepDims(s);else if(a.startsWith('sq'))squareWall(s,+a.slice(2));else if(a==='pal'){if(alignPost(s,s.x,s.y,true)){push();refresh();}else toast('Aucun mur proche.');}});
function dupSel(inplace){const s=getSel();if(!s)return;const k=S.sel.k;push();let c;
 if(inplace&&k==='op'){c=Object.assign({},s,{id:NID()});D.ops.push(c);}
 else if(k==='wall'||k==='beam'||k==='line'){const L=wlen(s)||1,f=inplace?0:.5,nx=-(s.y2-s.y1)/L*f,ny=(s.x2-s.x1)/L*f;c=Object.assign({},s,{id:NID(),x1:s.x1+nx,y1:s.y1+ny,x2:s.x2+nx,y2:s.y2+ny});(k==='wall'?D.walls:k==='line'?D.lines:D.beams).push(c);}
 else if(k==='op'){const G=opGeom(s);if(!G)return;const hw=s.w/2/G.L,gap=(s.w+.15)/G.L;let t2=null;
  for(const q of [s.t+gap,s.t-gap])if(q-hw>=.01&&q+hw<=.99){t2=q;break;}
  if(t2!==null)c=Object.assign({},s,{id:NID(),t:t2});
  else{let best=null;D.walls.forEach(wl=>{if(wl.id===s.wid)return;const L=wlen(wl);if(L<s.w+.3)return;const d=Math.hypot((wl.x1+wl.x2)/2-G.cx,(wl.y1+wl.y2)/2-G.cy);if(!best||d<best.d)best={wl,d};});
   if(!best){S.dupMode=false;return toast('Aucun mur assez long pour poser la copie.');}
   c=Object.assign({},s,{id:NID(),wid:best.wl.id,t:.5,w:Math.min(s.w,wlen(best.wl)-.2)});toast('Pas de place sur ce mur : copie posée sur le mur le plus proche. Glisse-la où tu veux.');}
  D.ops.push(c);}
 else if(k==='cote'){c=Object.assign({},s,{id:NID(),off:(s.off||0)+(inplace?0:.4)});D.cotes.push(c);}
 else if(k==='post'||k==='foot'){const a=s.a||0;c=Object.assign({},s,{id:NID(),x:s.x+Math.cos(a)*(inplace?0:.5),y:s.y+Math.sin(a)*(inplace?0:.5)});(k==='post'?D.posts:D.foots).push(c);}
 else return;S.dupOrig={k,id:s.id};S.dupInplace=!!inplace;S.sel={k,id:c.id};S.dupMode=true;if(k==='wall'||k==='beam'||k==='line'){S.dupKey=selKey();S.dupSrc={k,id:s.id};S.dupDist=.5;S.axSet=null;}computeRooms();refresh();
 if(!inplace)toast((k==='wall'||k==='beam'||k==='line')&&!c.sh?'Copie posée sur l\'original : glisse-la avec le doigt (écart affiché), ou choisis un côté avec les flèches.':'Copie créée : glisse ton doigt pour la placer.');}
function dupTapFallback(){const o=S.dupOrig;if(!o||!S.sel)return;const k=S.sel.k,id=S.sel.id,arr=k==='wall'?D.walls:k==='line'?D.lines:k==='beam'?D.beams:k==='op'?D.ops:k==='post'?D.posts:k==='foot'?D.foots:k==='cote'?D.cotes:null;if(!arr)return;const i=arr.findIndex(x=>x.id===id);if(i<0)return;arr.splice(i,1);S.sel={k:o.k,id:o.id};dupSel(false);}
function dupGesture(e){const q=getSel();if(!q)return;dupSel(true);if(!S.dupMode)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}

$('#ctx').addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;const s=getSel();if(!s)return;const num=()=>parseFloat(String(e.target.value).replace(',','.'));
 if(f==='axd'){const v=num();if(!setAxisDist(s,e.target.dataset.side,v))renderCtx();return;}
 if(f==='shw'||f==='shh'||f==='shd'){const v=num();if(!(v>=.05&&v<200))return renderCtx();push();
  if(f==='shw')s.x2=s.x1+(s.x2>=s.x1?1:-1)*v;else if(f==='shh')s.y2=s.y1+(s.y2>=s.y1?1:-1)*v;
  else{const mx=(s.x1+s.x2)/2,my=(s.y1+s.y2)/2;let dx=s.x2-s.x1,dy=s.y2-s.y1,L=Math.hypot(dx,dy);if(L<1e-6){dx=1;dy=0;L=1;}dx/=L;dy/=L;s.x1=mx-dx*v/2;s.y1=my-dy*v/2;s.x2=mx+dx*v/2;s.y2=my+dy*v/2;}
  refresh();return;}
 if(f==='lang'&&S.sel&&S.sel.k==='line'){const a=num();if(!isFinite(a))return renderCtx();push();rotLine(s,a-lineDeg(s));refresh();return;}
 if(f==='len'){const L=num();if(!(L>=.1&&L<200))return renderCtx();push();const ol=wlen(s),ux=(s.x2-s.x1)/ol,uy=(s.y2-s.y1)/ol,nx=s.x1+ux*L,ny=s.y1+uy*L;
  D.walls.forEach(q=>{if(q===s)return;if(Math.hypot(q.x1-s.x2,q.y1-s.y2)<.011){q.x1=nx;q.y1=ny;}if(Math.hypot(q.x2-s.x2,q.y2-s.y2)<.011){q.x2=nx;q.y2=ny;}});s.x2=nx;s.y2=ny;computeRooms();refresh();}

 else if(f==='oh'){const h=num();if(!(h>=.3&&h<=4))return renderCtx();push();s.h=h;refresh();}
 else if(f==='os'){const h=num();if(!(h>=0&&h<=3))return renderCtx();push();s.sill=h;refresh();}
 else if(f==='psl'||f==='psw'){const v=num()/100;if(!(v>=.05&&v<=1.5))return renderCtx();push();s[f==='psl'?'sl':'sw']=v;D.set[f==='psl'?'postL':'postW']=v;refresh();}

 else{try{const s=await CL.F.getDoc(CL.F.doc(CL.db,'comptes',mail));if(s.exists()&&s.data().actif===true)perm={full:s.data().role==='coadmin'};}catch(e){}}
 if(!perm){CL.msg='Ce compte n’est pas autorisé pour la synchronisation. Tes plans restent sur cet appareil.';CL.user=mail;clBadge();return;}
 clAttach(CL.db,CL.F,mail,perm);}
function clAttach(db,F,mail,perm){
 CL.db=db;CL.F=F;CL.user=mail;CL.full=!!perm.full;CL.mode='cloud';CL.msg='';CL.first=true;
 const q=perm.full?F.collection(db,'plans'):F.query(F.collection(db,'plans'),F.where('ow','==',mail));
 CL.unsub=F.onSnapshot(q,s=>clRecu(s),e=>{CL.msg='Synchronisation refusée (règles Firebase) : '+((e&&e.code)||'erreur');CL.mode='local';clBadge();});
 clBadge();}
function clRecu(snap){const cloud={};
 snap.docs.forEach(x=>{cloud[x.id]=x.data();CL.own[x.id]=x.data().ow;});
 snap.docChanges().forEach(ch=>{const x=ch.doc;if(x.metadata&&x.metadata.hasPendingWrites)return;
  if(ch.type==='removed')clRemoved(x.id);else clApply(x.id,x.data());});
 if(CL.first&&!(snap.metadata&&snap.metadata.fromCache)){CL.first=false;
  Object.values(savedProjects()).forEach(p=>{const c=cloud[p.id];if(p.doc&&p.doc.walls&&(p.doc.walls.length||(p.doc.posts&&p.doc.posts.length))&&(!c||p.ts>(c.u||0)+1000))clPushProj(p);});}
 clBadge();}
function clApply(id,d){
 if(!d||typeof d.d!=='string'||d.dev===CL.dev)return;
 const all=savedProjects(),loc=all[id];if(loc&&loc.ts>=d.u)return;
 let doc;try{doc=JSON.parse(d.d);}catch(e){return;}
 const open=D.pid===id;
 if(open){
  if(CL.down||S.draft||S.chain){clearTimeout(CL.rt);CL.rt=setTimeout(()=>clApply(id,d),900);return;}
  if(S.dirty){const cid=id+'_'+d.dev;doc.pid=cid;doc.name=(d.name||'Plan')+' (autre appareil)';all[cid]={id:cid,name:doc.name,ts:Date.now(),doc,ow:''};clWrite(all);toast('Modifié ailleurs en même temps : l’autre version est gardée à part.');if(sheetOpen)refreshSheet();return;}}
 const img=open?(D.meet&&D.meet.img):(loc&&loc.doc&&loc.doc.meet&&loc.doc.meet.img);
 if(img){doc.meet=doc.meet||{img:null,pins:[],nid:1};if(!doc.meet.img)doc.meet.img=img;}
 doc.pid=id;
 if(open){const v={s:V.s,ox:V.ox,oy:V.oy};loadDoc(doc);D.pid=id;V.s=v.s;V.ox=v.ox;V.oy=v.oy;toast('Plan mis à jour depuis un autre appareil.');draw();}
 const a2=savedProjects();a2[id]={id,name:doc.name||d.name||'Plan',ts:d.u,doc,ow:d.ow||''};clWrite(a2);
 CL.last[id]=clHash(d.d);if(sheetOpen)refreshSheet();}
function clRemoved(id){if(D.pid===id)return;const a=savedProjects();if(a[id]){delete a[id];clWrite(a);if(sheetOpen)refreshSheet();}}
function clPush(){if(CL.mode!=='cloud'||!D.pid||!hasContent())return;clearTimeout(CL.pt);const id=D.pid;CL.pt=setTimeout(()=>clPushProj(savedProjects()[id]),1200);}
function clPushProj(p){if(CL.mode!=='cloud'||!p||!p.doc)return;let s=JSON.stringify(p.doc);
 if(s.length>900000){const c=clone(p.doc);if(c.meet)c.meet.img=null;s=JSON.stringify(c);if(s.length>900000){if(!CL.warned){CL.warned=true;toast('Plan trop lourd pour la synchronisation : garde-le aussi en fichier .json.');}return;}}
 const h=clHash(s);if(CL.last[p.id]===h)return;CL.last[p.id]=h;
 try{CL.F.setDoc(CL.F.doc(CL.db,'plans',p.id),{id:p.id,name:p.name||'Plan',d:s,u:p.ts,ow:CL.own[p.id]||p.ow||CL.user,by:CL.user,dev:CL.dev}).catch(e=>{delete CL.last[p.id];CL.msg='Envoi refusé : '+((e&&e.code)||'erreur');clBadge();});}catch(e){delete CL.last[p.id];}}
function clDel(id){if(CL.mode!=='cloud')return;try{CL.F.deleteDoc(CL.F.doc(CL.db,'plans',id)).catch(()=>{});}catch(e){}delete CL.last[id];}
function autoSave(){if(!S.dirty||!hasContent())return;saveProject(true);clPush();}
window.addEventListener('pointerdown',()=>{CL.down=true;},true);
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>{CL.down=false;},true));

/* ===== V17 : projets et dessins ===== */
const PJ_OLD='anciens';
const H={view:'pj',pj:null,pn:'',own:''};
const FROM_SM=(()=>{try{if(/[?&]from=sm\b/.test(location.search)){sessionStorage.setItem('a2d_from','1');return true;}return sessionStorage.getItem('a2d_from')==='1';}catch(e){return /[?&]from=sm\b/.test(location.search);}})();
function pjOf(r){return(r.doc&&r.doc.pj)||PJ_OLD;}
function pjNm(r){return(r.doc&&r.doc.pjn)||'Anciens plans';}
function pjMap(){try{return JSON.parse(localStorage.getItem('a2d_pj')||'{}');}catch(e){return{};}}
function pjSave(m){try{localStorage.setItem('a2d_pj',JSON.stringify(m));}catch(e){}}
function isMine(r){return !r.ow||r.ow===CL.user;}
function allPlans(){return Object.values(savedProjects()).filter(r=>r&&r.doc&&Array.isArray(r.doc.walls));}
function pjGroups(team){const g={};
 allPlans().forEach(r=>{if(!!team===isMine(r))return;const k=pjOf(r)+'|'+(team?r.ow:'');const o=g[k]||(g[k]={id:pjOf(r),name:pjNm(r),ow:team?r.ow:'',plans:[],ts:0});o.plans.push(r);o.ts=Math.max(o.ts,r.ts||0);});
 if(!team){const m=pjMap();Object.values(m).forEach(p=>{const k=p.id+'|';if(!g[k])g[k]={id:p.id,name:p.name,ow:'',plans:[],ts:p.ts||0};});}
 return Object.values(g).sort((a,b)=>b.ts-a.ts);}
function dstr(ts){try{return new Date(ts).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
const TH={};
function thumb(r){const k=r.id+':'+r.ts;if(TH[k]!==undefined)return TH[k];let url='';
 try{const c=document.createElement('canvas');c.width=300;c.height=212;const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,300,212);
  const keep=D;D=Object.assign(newDoc(),clone(r.doc));D.set=Object.assign(newDoc().set,D.set);D.pr=Object.assign(newDoc().pr,D.pr);D.meet=Object.assign({img:null,pins:[],nid:1},D.meet);
  try{if(D.walls.length||D.lines.length||D.posts.length){const v={s:1,ox:0,oy:0};fitView(v,300,212,14,bounds());drawPlan(g,300,212,v,{k:.4});}}finally{D=keep;}
  url=c.toDataURL('image/png');}catch(e){url='';}
 TH[k]=url;return url;}
function pjCard(g,team){return `<div class="hc" data-h="pj" data-id="${esc(g.id)}" data-ow="${esc(g.ow)}" data-pn="${esc(g.name)}" style="cursor:pointer"><span style="font-size:26px">📁</span><div class="tt"><b>${esc(g.name)}</b><small>${g.plans.length} dessin${g.plans.length>1?'s':''}${team?' · '+esc(g.ow):''}${g.ts?' · '+dstr(g.ts):''}</small></div>${team?'':`<button class="btn sm" data-h="rnpj" data-id="${esc(g.id)}" data-pn="${esc(g.name)}">✎</button><button class="btn bad sm" data-h="dlpj" data-id="${esc(g.id)}" data-pn="${esc(g.name)}">🗑</button>`}</div>`;}
function pjHtml(){const mine=pjGroups(false),team=pjGroups(true);
 const last=allPlans().filter(r=>r.doc.walls.length||(r.doc.posts&&r.doc.posts.length)).sort((a,b)=>b.ts-a.ts)[0];
 const on=CL.mode==='cloud';
 return `<div class="hh">${FROM_SM?'<a class="btn sm" href="./" style="text-decoration:none;color:var(--tx)">← SITE MANAGER</a>':''}<h1>Projets</h1><button class="ib" data-h="cl" style="color:${on?'#16a34a':'#94a3b8'};font-size:18px;width:auto;padding:0 10px">${on?'☁✓':'☁'}</button></div>
 <div class="hb"><div class="hbar"><button class="btn pri" data-h="npj">+ Créer un projet</button><button class="btn" data-h="imp">Importer un fichier</button><button class="btn" data-h="exall">Tout sauvegarder (.json)</button></div>
 ${last?`<div class="hc" data-h="open" data-id="${esc(last.id)}" style="cursor:pointer;border-color:var(--pri)"><div class="tt"><small>Continuer</small><b>${esc(last.name)}</b><small>${esc(pjNm(last))} · ${dstr(last.ts)}</small></div><span style="font-size:18px">▶</span></div>`:''}
 ${mine.map(g=>pjCard(g)).join('')||'<div class="note">Aucun projet pour l’instant. Touche « Créer un projet ».</div>'}
 ${team.length?'<h4 style="margin:14px 2px 8px">Équipe</h4>'+team.map(g=>pjCard(g,true)).join(''):''}</div>`;}
function drHtml(){const plans=allPlans().filter(r=>pjOf(r)===H.pj&&(H.own?r.ow===H.own:isMine(r))).sort((a,b)=>b.ts-a.ts);
 return `<div class="hh"><button class="btn sm" data-h="back">← Projets</button><h1>${esc(H.pn)}${H.own?' <small style="font-weight:500;color:var(--mut)">· '+esc(H.own)+'</small>':''}</h1></div>
 <div class="hb"><div class="hbar">${H.own?'':'<button class="btn pri" data-h="ndr">+ Créer un dessin</button>'}<button class="btn" data-h="exj">Sauvegarder ce projet (.json)</button>${H.own?'':'<button class="btn" data-h="imp">Importer</button>'}</div>
 <div class="hgrid">${plans.map(r=>`<div class="hd"><img data-h="open" data-id="${esc(r.id)}" src="${thumb(r)}" alt=""><div class="tt"><b style="font-size:14px;word-break:break-word">${esc(r.name)}</b><small style="display:block;color:var(--mut)">${dstr(r.ts)}</small><div style="display:flex;gap:4px;margin-top:6px;flex-wrap:wrap"><button class="btn sm" data-h="open" data-id="${esc(r.id)}">Ouvrir</button><button class="btn sm" data-h="rndr" data-id="${esc(r.id)}">✎</button><button class="btn sm" data-h="cpdr" data-id="${esc(r.id)}" title="Copier vers un autre projet">⧉</button><button class="btn bad sm" data-h="dldr" data-id="${esc(r.id)}">🗑</button></div></div></div>`).join('')||'<div class="note" style="grid-column:1/-1">Aucun dessin dans ce projet.</div>'}</div></div>`;}
function homeRender(){const h=$('#home');if(!h||h.hidden)return;const sc=h.querySelector('.hb');const top=sc?sc.scrollTop:0;h.innerHTML=H.view==='dr'?drHtml():pjHtml();const nb=h.querySelector('.hb');if(nb)nb.scrollTop=top;}
function homeOpen(view){if(view)H.view=view;else H.view='pj';$('#home').hidden=false;homeRender();}
function homeClose(){$('#home').hidden=true;}
function newDessin(pj,pn){if(S.dirty&&hasContent())saveProject(true);loadDoc(newDoc('Nouveau dessin'));D.pj=pj;D.pjn=pn;S.pj=pj;S.pjn=pn;D.pid=null;saveProject(true);homeClose();pushEdit();toast('Nouveau dessin créé.');}
function openPlan(id){const p=savedProjects()[id];if(!p)return;if(D.pid!==id&&S.dirty&&hasContent())saveProject(true);if(D.pid!==id){loadDoc(p.doc);D.pid=p.id;}S.pj=pjOf(p);S.pjn=pjNm(p);homeClose();pushEdit();}
function renamePj(id,nm){const all=savedProjects(),ids=[];Object.values(all).forEach(r=>{if(r.doc&&pjOf(r)===id&&isMine(r)){r.doc.pjn=nm;r.ts=Date.now();ids.push(r.id);}});clWrite(all);const m=pjMap();if(m[id]){m[id].name=nm;pjSave(m);}if(D.pj===id)D.pjn=nm;ids.forEach(i=>clPushProj(all[i]));}
function delPlan(id){const all=savedProjects();delete all[id];clWrite(all);clDel(id);if(D.pid===id){loadDoc(newDoc('Nouveau dessin'));D.pid=null;}}
function jn(s){return(s||'export').replace(/[^\w\-]+/g,'_');}
function dlJson(name,obj){FORCE_DL=true;const p=saveFile(name,new Blob([JSON.stringify(obj)],{type:'application/json'}));Promise.resolve(p).finally(()=>{FORCE_DL=false;});}
function exportPj(){if(S.dirty&&hasContent())saveProject(true);const plans=allPlans().filter(r=>pjOf(r)===H.pj&&(H.own?r.ow===H.own:isMine(r))).map(r=>r.doc);if(!plans.length)return toast('Ce projet est vide.');dlJson(jn(H.pn)+'.a2d-projet.json',{a2d:'projet',v:1,name:H.pn,pj:H.pj,plans});}
function exportAll(){if(S.dirty&&hasContent())saveProject(true);const plans=allPlans().map(r=>r.doc);if(!plans.length)return toast('Rien à sauvegarder.');dlJson('Atelier2D_tout.a2d-tout.json',{a2d:'tout',v:1,plans});}
function importAny(d){
 if(d&&Array.isArray(d.plans)&&(d.a2d==='projet'||d.a2d==='tout')){let n=0;const all=savedProjects(),ids=[];
  d.plans.forEach((p,i)=>{if(!p||!Array.isArray(p.walls))return;const c=clone(p);c.pid='p'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,4);if(!c.pj){c.pj=d.pj||PJ_OLD;c.pjn=d.name||'Anciens plans';}all[c.pid]={id:c.pid,name:c.name||'Dessin',ts:Date.now()+i,doc:c,ow:''};ids.push(c.pid);n++;});
  clWrite(all);ids.forEach(i=>clPushProj(all[i]));toast(n+' dessin'+(n>1?'s':'')+' importé'+(n>1?'s':'')+'.');homeRender();closeSheet();return;}
 if(!d||!Array.isArray(d.walls))throw 0;
 if(S.dirty&&hasContent())saveProject(true);d.pid=null;
 const inHome=!$('#home').hidden;if(inHome&&H.view==='dr'&&!H.own){d.pj=H.pj;d.pjn=H.pn;}
 loadDoc(d);saveProject(true);clPush();
 if(inHome){toast('Dessin importé.');homeRender();}else{closeSheet();toast('Dessin importé.');}}
function clToggle(){if(CL.mode==='cloud')return toast('Synchronisé · '+CL.user);if(CL.can)return CL.A.signInWithPopup(CL.auth,new CL.A.GoogleAuthProvider()).catch(()=>toast('Connexion annulée.'));toast(CL.msg||'Hors connexion : les plans restent sur cet appareil.');}
$('#home').addEventListener('click',e=>{const b=e.target.closest('[data-h]');if(!b)return;const a=b.dataset.h,id=b.dataset.id;
 if(a==='pj'){H.view='dr';H.pj=id;H.pn=b.dataset.pn||'';H.own=b.dataset.ow||'';S.pj=id;S.pjn=H.pn;homeRender();}
 else if(a==='back'){H.view='pj';homeRender();}
 else if(a==='npj'){const n=prompt('Nom du projet ?','Nouveau projet');if(n===null)return;const nm=n.trim()||'Nouveau projet',m=pjMap(),pid='j'+Date.now().toString(36);m[pid]={id:pid,name:nm,ts:Date.now()};pjSave(m);H.view='dr';H.pj=pid;H.pn=nm;H.own='';S.pj=pid;S.pjn=nm;homeRender();}
 else if(a==='rnpj'){const n=prompt('Nouveau nom du projet ?',b.dataset.pn||'');if(n===null||!n.trim())return;renamePj(id,n.trim());homeRender();}
 else if(a==='dlpj'){const pl=allPlans().filter(r=>pjOf(r)===id&&isMine(r));if(!confirm('Supprimer le projet « '+(b.dataset.pn||'')+' » et ses '+pl.length+' dessin(s) ? Cette action est définitive.'))return;pl.forEach(r=>delPlan(r.id));const m=pjMap();delete m[id];pjSave(m);homeRender();}
 else if(a==='ndr')newDessin(H.pj,H.pn);
 else if(a==='open')openPlan(id);
 else if(a==='rndr'){const all=savedProjects(),r=all[id];if(!r)return;const n=prompt('Nom du dessin ?',r.name||'');if(n===null||!n.trim())return;r.name=r.doc.name=n.trim();r.ts=Date.now();clWrite(all);if(D.pid===id){D.name=r.name;$('#pname').value=r.name;}clPushProj(r);homeRender();}
 else if(a==='cpdr'){const all=savedProjects(),r=all[id];if(!r)return;const gs=pjGroups(false);const t=prompt('Copier vers quel projet ? Tape son numéro :\n'+gs.map((g,i)=>(i+1)+'. '+g.name).join('\n'));const k=parseInt(t,10)-1;if(!(k>=0&&k<gs.length))return;const g=gs[k];const c=clone(r.doc);c.pid='p'+Date.now().toString(36)+Math.random().toString(36).slice(2,4);c.pj=g.id;c.pjn=g.name;c.name=r.name+' (copie)';all[c.pid]={id:c.pid,name:c.name,ts:Date.now(),doc:c,ow:''};clWrite(all);clPushProj(all[c.pid]);toast('Copié dans « '+g.name+' ».');homeRender();}
 else if(a==='dldr'){const r=savedProjects()[id];if(!r||!confirm('Supprimer le dessin « '+r.name+' » ?'))return;delPlan(id);homeRender();}
 else if(a==='exj')exportPj();
 else if(a==='exall')exportAll();
 else if(a==='imp')$('#f-json').click();
 else if(a==='cl')clToggle();});
function goHome(){if(S.dirty&&hasContent())saveProject(true);const r=savedProjects()[D.pid];
 if(r){H.view='dr';H.pj=pjOf(r);H.pn=pjNm(r);H.own=(r.ow&&r.ow!==CL.user)?r.ow:'';S.pj=H.pj;S.pjn=H.pn;}else H.view='pj';
 homeOpen(H.view);}
function goHomeBtn(){if(!$('#home').hidden)return;if(S.hpush){S.hpush=false;try{history.back();return;}catch(e){}}goHome();}
function pushEdit(){try{history.pushState({a2d:1},'');S.hpush=true;}catch(e){}}
window.addEventListener('popstate',()=>{if(PV.skip){PV.skip=false;return;}if(PV.open){pvClose(true);return;}S.hpush=false;if($('#home').hidden){closeSheet();goHome();}});
$('#b-back').onclick=goHomeBtn;$('#b-pdf').onclick=pvOpen;

(function init(){let d=null;try{d=JSON.parse(localStorage.getItem('a2d_draft')||'null');}catch(e){}
 if(d&&Array.isArray(d.walls)&&(d.walls.length||d.posts&&d.posts.length||(d.meet&&d.meet.pins&&d.meet.pins.length)))loadDoc(d);else loadDoc(sampleDoc());
 renderTools();refresh();setTimeout(()=>{fitNow();draw();},30);clStart();homeOpen('pj');window.__cl={CL,clAttach,clRecu,clApply,clPushProj,autoSave,savedProjects};window.__a2d={toWalls,msAct,D:()=>D,S,V,loadDoc,addWall,msMirror,msBBox,setTool,computeRooms,metres,setMode,squareAll,dupSel,dupPlace};})();
